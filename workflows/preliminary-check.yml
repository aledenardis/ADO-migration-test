name: Preliminary Check

on:
  pull_request:
    branches:
      - main

jobs:
  prrelimminary-check:
    name: Preliminary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4

      - name: Run Preliminary Check
        shell: bash
        run: |
          echo "running preliminary check..."
          CHECK_RESULT="PASS"
          if [ "$CHECK_RESULT" = "PASS" ]; then
            echo "check passed"
            exit 0
          else
            echo "check failed"
            exit 1
          fi
